# ★ Shorebird 补丁 CI 示例（仅作参考，未启用）
# 想启用时把本文件改名到 .github/workflows/shorebird-patch.yml 并配置 Secrets：
#   SHOREBIRD_TOKEN      在 shorebird login 后 `shorebird account apikey` 获取
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD（Android 签名）
#
# 适用：只改了 Dart 代码的日常小补丁；原生变更仍走 build.yml 出正式包。

name: Shorebird Patch (Android)
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "已发布版本的 build number（如 152）"
        required: true
      track:
        description: "staging / stable"
        default: "staging"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Shorebird CLI
        run: curl --proto '=https' --tlsv1.2 -sSfL https://shorebird.dev/install.sh | bash

      - name: 还原 Android 签名
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 发布补丁
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          TRACK: ${{ inputs.track }}
        run: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird patch android --build-number="$BUILD_NUMBER" --track="$TRACK"
