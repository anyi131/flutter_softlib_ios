name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Cache pub & gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pubgradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-pubgradle-

      - name: Pub get
        run: flutter pub get

      # ═══════════════════════════════════════════════════════════════════
      # ★ 签名（关键：必须「先生成一次 → 永久复用」，不能每次重新生成）
      #   原因：keytool -genkeypair 每次都会写入不同的序列号/时间/salt，
      #        即使 -dname/-alias/-password 完全一样，产出的证书也不同，
      #        导致每次构建签名不一致 → 新包无法覆盖安装旧包。
      #
      #   方案（按优先级）：
      #     ① Secrets 提供 ANDROID_KEYSTORE_BASE64 → 用你的固定签名库
      #     ② 否则用 GitHub Actions cache 保存一份自动生成的 keystore，
      #        首次生成后永久复用（cache 未失效则签名恒定）
      # ═══════════════════════════════════════════════════════════════════

      - name: Restore auto keystore from cache
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        id: auto-ks
        uses: actions/cache@v4
        with:
          path: ~/anyi-keystore
          key: anyi-release-keystore-fixed-v3

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AUTO_HIT: ${{ steps.auto-ks.outputs.cache-hit }}
        run: |
          mkdir -p android/app/keystore
          KS="$GITHUB_WORKSPACE/android/app/keystore/release.jks"

          if [ -n "$KS_B64" ]; then
            echo "→ 使用 Secrets 提供的签名库"
            echo "$KS_B64" | base64 -d > "$KS"
            STORE_PASS="$KS_PASS"
            ALIAS="$KS_ALIAS"
            KEY_PASS="${KS_KEYPASS:-$KS_PASS}"
          else
            mkdir -p "$HOME/anyi-keystore"
            SRC="$HOME/anyi-keystore/anyi.jks"
            if [ ! -f "$SRC" ]; then
              echo "→ 首次生成固定签名库（之后永久复用）"
              keytool -genkeypair \
                -keystore "$SRC" -storetype JKS \
                -keyalg RSA -keysize 2048 -validity 10950 \
                -alias yfx -storepass 'bm666...' -keypass 'bm666...' \
                -dname "CN=鲁梓熙, OU=Dev, O=Anyi, L=Beijing, ST=Beijing, C=CN"
            else
              echo "→ 复用缓存中的固定签名库"
            fi
            cp "$SRC" "$KS"
            STORE_PASS='bm666...'
            ALIAS='yfx'
            KEY_PASS='bm666...'
          fi

          echo "ANDROID_KEYSTORE_PATH=$KS" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

          echo "=== 本次使用的签名证书指纹 ==="
          keytool -list -v -keystore "$KS" -storepass "$STORE_PASS" 2>/dev/null \
            | grep -iE "MD5|SHA1|SHA256|Alias|别名" | head -5 || true

      - name: Build APK (release)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
