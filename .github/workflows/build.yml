name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Cache pub & gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pubgradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-pubgradle-

      - name: Pub get
        run: flutter pub get

      # ═══════════════════════════════════════════════════════════
      # ★ 1014 签名：从 GitHub Secrets 读取，代码里不含任何密码
      #   需在仓库 Settings → Secrets and variables → Actions 配置：
      #     ANDROID_KEYSTORE_BASE64  你的 .jks 的 base64（必须）
      #     ANDROID_STORE_PASSWORD   密钥库密码（必须）
      #     ANDROID_KEY_ALIAS        别名（必须）
      #     ANDROID_KEY_PASSWORD     密钥密码（可留空，默认同密钥库密码）
      #   未配置时自动退回 debug 签名，构建不会失败。
      # ═══════════════════════════════════════════════════════════
      - name: Set up release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KS_B64" | base64 -d > android/app/keystore/release.jks
          echo "签名文件已就绪：$(ls -la android/app/keystore/release.jks)"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/keystore/release.jks" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build APK (release)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true' 

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
