name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Cache pub & gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pubgradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-pubgradle-

      - name: Pub get
        run: flutter pub get

      # ★ 1014：固定签名密钥（首次生成后缓存，之后所有构建复用同一签名，
      #   否则每次构建签名不同 → 新包无法覆盖安装旧包）
      # ★ 1014：固定签名密钥 —— cache 必须放在「生成」之前，
      #   否则缓存尚未恢复就重新生成，签名每次都变（踩过的坑）。
      - name: Restore release keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/keystore-cache
          key: anyi-release-keystore-v2

      - name: Create release keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/keystore-cache"
          keytool -genkeypair -v \
            -keystore "$HOME/keystore-cache/anyi-release.jks" \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -alias anyi \
            -storepass anyi2026softlib \
            -keypass anyi2026softlib \
            -dname "CN=Anyi Softlib, OU=Dev, O=Anyi, L=Beijing, ST=Beijing, C=CN"

      - name: Copy keystore into project
        run: |
          mkdir -p android/app/keystore
          cp "$HOME/keystore-cache/anyi-release.jks" android/app/keystore/anyi-release.jks

      - name: Build APK (release)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true' 

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
