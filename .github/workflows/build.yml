name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Cache pub & gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pubgradle-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-pubgradle-

      - name: Pub get
        run: flutter pub get

      # ═══════════════════════════════════════════════════════════════════
      # ★ 1015 签名方案（重大变更）：
      #   直接使用仓库内固定的签名库 android/app/keystore/ayrjh.jks
      #   （别名 ayrjh，v1+v2+v3 全开）。
      #
      #   为什么不用「自动生成 + 缓存复用」那套：
      #     ① keytool -genkeypair 每次生成的证书都不同（序列号/时间/salt），
      #        一旦 cache 失效重建 → 签名变化 → 新包装不上旧包；
      #     ② Secrets 方式需要你手动维护密码，容易配错。
      #   现在签名库随仓库走，任何机器、任何时候构建，签名都完全一致。
      # ═══════════════════════════════════════════════════════════════════

      - name: Prepare keystore
        run: |
          KS="$GITHUB_WORKSPACE/android/app/keystore/ayrjh.jks"
          if [ ! -f "$KS" ]; then
            echo "::error::签名库不存在：$KS"
            exit 1
          fi
          STORE_PASS='bm666...'
          ALIAS='ayrjh'
          KEY_PASS='bm666...'

          echo "ANDROID_KEYSTORE_PATH=$KS" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

          echo "=== 本次使用的签名证书指纹 ==="
          keytool -list -v -keystore "$KS" -storepass "$STORE_PASS" 2>/dev/null \
            | grep -iE "MD5|SHA1|SHA256|Alias|Valid" | head -6 || true

      - name: Build APK (release)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
