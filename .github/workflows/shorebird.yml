name: Shorebird (OTA 基线/补丁)

# ★ 1106e：把 154 作为 Shorebird 热更新基线
#   基线只需打一次；之后 Dart 层的小修小改走「补丁」，用户重启即生效，不再发版。
#
# 前置（只需做一次，在你 Mac 上）：
#   1) curl --proto '=https' --tlsv1.2 -sSfL https://shorebird.dev/install.sh | bash
#   2) shorebird login
#   3) cd 仓库根目录 && shorebird init      # 生成 shorebird.yaml（提交它）
#   4) shorebird account apikey             # 得到 token，填到 GitHub Secrets：SHOREBIRD_TOKEN
#
# 之后：
#   · 打基线：本工作流选 release
#   · 发补丁：本工作流选 patch（改的是 Dart 代码时用）

on:
  workflow_dispatch:
    inputs:
      command:
        description: "release = 打基线包；patch = 发热更新补丁"
        type: choice
        options: [release, patch]
        default: release
      build_number:
        description: "版本 build 号（如 154）"
        required: true
        default: "154"
      flutter_version:
        description: "Shorebird 对应的 Flutter 版本（保持与正式包一致）"
        required: true
        default: "3.38.7"

jobs:
  shorebird:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Shorebird CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://shorebird.dev/install.sh | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - name: 准备签名（与 build.yml 同一套 jks）
        run: |
          KS="$GITHUB_WORKSPACE/android/app/keystore/ayrjh.jks"
          test -f "$KS" || { echo "::error::签名库不存在"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$KS" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=bm666..." >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=ayrjh" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=bm666..." >> $GITHUB_ENV

      - name: 检查 shorebird.yaml
        run: |
          if [ ! -f shorebird.yaml ]; then
            echo "::error::缺少 shorebird.yaml —— 请先在本地执行 shorebird init 并提交"
            exit 1
          fi
          cat shorebird.yaml

      - name: 打基线包 / 发补丁
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          CMD: ${{ inputs.command }}
          BUILD: ${{ inputs.build_number }}
          FLUTTER_VER: ${{ inputs.flutter_version }}
        run: |
          set -e
          if [ "$CMD" = "release" ]; then
            shorebird release android \
              --build-number="$BUILD" \
              --flutter-version="$FLUTTER_VER" \
              -- --obfuscate --split-debug-info=build/symbols
          else
            shorebird patch android \
              --build-number="$BUILD" \
              --flutter-version="$FLUTTER_VER"
          fi

      - name: 上传产物
        if: ${{ inputs.command == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
